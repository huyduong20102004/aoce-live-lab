<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="/style.css"><script type="module" src="/directory.js"></script><title>Employee directory table</title></head>
<body class="directory-body"><form id="search-form" class="search-bar"><label for="search-id">Search employee ID</label><div class="search-controls"><input id="search-id" name="id" placeholder="Enter exact Employee ID" autocomplete="off"><button type="submit">Search</button><button type="button" id="clear-search" class="subtle">Clear</button></div></form>
<p id="search-state" role="status" class="muted"></p><div class="table-wrap"><table aria-label="Employees"><thead><tr><th>Employee ID</th><th>Department</th><th>Access</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div><p id="empty" class="empty" hidden>No employees found.</p><p id="directory-error" role="alert"></p></body></html>
